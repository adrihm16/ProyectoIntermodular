<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OnePlus 15 - Synapse</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>

    <header>
        <div class="logo">💠 SYNAPSE</div>
        <div class="icons">🛒</div>
    </header>

    <div class="breadcrumb">
        Inicio > Smartphones > OnePlus > OnePlus 15
    </div>

    <main class="product-container">
        <div class="product-image">
            <img src="https://via.placeholder.com/400x500/ddd/333?text=OnePlus+15" alt="OnePlus 15">
        </div>

        <div class="product-details">
            <h1>OnePlus 15</h1>
            <div class="price-tag">1029,00€</div>

            <span class="label">Color</span>
            <div class="color-options">
                <div class="color-circle selected" title="Infinite Black">Negro</div>
                <div class="color-circle" title="Sand Storm">Arena</div>
            </div>

            <span class="label">Almacenamiento</span>
            <div class="storage-options">
                <div class="chip">256 GB</div>
                <div class="chip selected">512 GB</div>
            </div>

            <div class="gift-box">
                <img src="https://via.placeholder.com/50?text=Gift" alt="Regalo">
                <div class="gift-info">
                    <h4>Incluye DJI Mobile 7</h4>
                    <span>¡GRATIS! (Valorado en 99€)</span>
                </div>
            </div>

            <button class="btn-add" onclick="window.location.href='carrito.html'">
                Añadir al carrito
            </button>
        </div>
    </main>
</body>
</html>
